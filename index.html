<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <title>CampusIssues - Campus complaint and feedback portal</title>
    <meta
      name="description"
      content="Raise, track and resolve campus issues. Students file complaints with a tracking ID, staff triage and respond, and everyone sees where things stand."
    />
    <meta name="theme-color" content="#47266b" />

    <meta property="og:title" content="CampusIssues" />
    <meta
      property="og:description"
      content="Raise, track and resolve campus issues in one place."
    />
    <meta property="og:type" content="website" />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('campusissues.theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage blocked - fall back to light */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
