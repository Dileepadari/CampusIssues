name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev || true
      - name: Fail on critical advisories
        run: |
          count=$(npm audit --omit=dev --json | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const v = JSON.parse(s).metadata?.vulnerabilities ?? {};
              console.log(v.critical ?? 0);
            });
          ")
          echo "critical advisories: $count"
          test "$count" -eq 0
